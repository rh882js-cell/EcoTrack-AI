<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack AI - Clasificador Ecológico</title>

    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado con Gamificación -->
    <header class="app-header">
        <div class="brand-title">
            <span>♻️</span> EcoTrack AI
        </div>
        <div class="gamification-badge" id="badgePuntos">
            🌿 <span id="puntosValor">120</span> XP
        </div>
    </header>

    <!-- Layout Principal -->
    <div class="main-layout">
        
        <!-- Bloque 1: Escáner e Interacción -->
        <div class="card">
            <h2 class="card-title">🔍 Escáner en Tiempo Real</h2>
            <div class="scanner-view" id="scannerBox">
                <p id="placeholderText" style="color: var(--text-secondary); text-align:center;">Presiona el botón para encender la cámara e identificar el residuo</p>
                <div class="scan-overlay" id="scanOverlay"></div>
                <div class="scan-line" id="scanLine"></div>
            </div>
            
            <button class="btn-action" onclick="iniciarEscaner()">⚡ Activar Cámara IA</button>
        </div>

        <!-- Bloque 2: Resultados e Impacto Ecológico -->
        <div class="card impact-card">
            <h2 class="card-title">📊 Diagnóstico Ecológico</h2>
            
            <div id="predictionsContainer">
                <p style="color: var(--text-secondary);">Esperando análisis del modelo de visión artificial...</p>
            </div>

            <div class="impact-detail" id="ecoImpactInfo" style="margin-top: 20px;">
                <hr style="border-color: var(--border-color); margin-bottom: 15px;">
                <p><strong>ODS #12:</strong> Garantizar modalidades de consumo y producción sostenibles.</p>
            </div>
        </div>

    </div>

    <!-- Carga de Librerías TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <!-- Script de lógica JS -->
    <script src="app.js"></script>
</body>
</html>
